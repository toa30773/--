async function gen(){
 if(!D.key){T('設定でAPIキーを入れてください');return go('set')}
 const dt=today(),d=day(dt),t=day(tom()),b=document.getElementById('gb');if((d.mv||[]).some(m=>!m.e))return T('ボタンの記録が終了していません。「今日」で終了してください');if(!d.money.length&&!d.nomoney)return cf('今日の支出と収入が未入力です。「なし」として日報を作りますか？',()=>{d.nomoney=1;save();gen()});b.disabled=true;b.textContent='作成中…';

 const bl=(l,w,s,e,st,txt,min,onc)=>`<div ${onc?`onclick="${onc}"`:''} style="position:absolute;left:${l};width:${w};top:${Y(s)}px;height:${Math.max(min,Y(e)-Y(s))}px;box-sizing:border-box;border-radius:8px;font-size:11px;line-height:1.25;padding:2px 5px;overflow:hidden;${st}">${esc(txt)}</div>`;
 return `<div style="position:relative;height:${1320*PX}px;margin:8px 0 8px 44px;border-left:1px solid #d4d4d8">
${[...Array(23)].map((_,q)=>`<div style="position:absolute;left:-44px;right:0;top:${q*60*PX}px;border-top:1px solid #ececee"><span style="position:absolute;left:0;top:-8px;width:38px;text-align:right;font-size:11px;color:#71717a">${(6+q)%24}:00</span></div>`).join('')}
${layout(planOf(dk)).map(x=>bl('4px','calc(50% - 6px)',x.s,x.e,`border:1.5px ${x.fixed?'solid':'dashed'} #09090b;background:${x.i.e?'#ececee':'#fff'};${TSEL==x.i.id?'box-shadow:0 0 0 3px rgba(9,9,11,.3);':''}`,x.i.n,22,isT?`TSEL='${x.i.id}';R()`:'')).join('')}
${mvs.map(m=>bl('calc(50% + 2px)','calc(50% - 6px)',mn(m.s),m.e?mn(m.e):(isT?nm:mn(m.s)+15),'background:'+MVC(m.k)+';color:#fff;',m.k,16)).join('')}
${act.map(i=>{const a=mn(i.s),b=i.e?mn(i.e):Math.max(a+1,isT?nm:a+30);return bl('calc(50% + 2px)','calc(50% - 6px)',a,i.e&&i.s==i.e?a+15:b,'background:#09090b;color:#fff;',i.n,18)}).join('')}
${dd&&dd.wake&&dd.wake.t?bl('calc(50% + 2px)','calc(50% - 6px)',mn(dd.wake.t),mn(dd.wake.t)+15,'background:#09090b;color:#fff;','起床・目標確認',18):''}

function nextCard(){const d=day(today()),P=vp(d),i=P.find(i=>i.s&&!i.e)||P.find(i=>!i.s&&!i.k);if(!i)return'<div class=card><b>全部記録済みです</b></div>';const a=`'${i.id}'`;

const sk=id=>{snap('飛ばす',id);F(id).k=1;save();R()};
function TVW(){const d=day(today()),tv=D.tv||'list',isT=TD==today(),
 tog=`<div class="row seg" style="margin:12px 0"><button class="${tv=='list'?'p':''}" onclick="D.tv='list';save();R()">リスト</button><button class="${tv=='time'?'p':''}" onclick="D.tv='time';TD=today();R()">時間軸</button></div>`;
 if(tv=='list')return tog+(vp(d).length?vp(d).map(card).join('')+hid(d):'<p>予定がありません。「予定」タブでテンプレを登録するか、下から追加。</p>');

<div class="r sm" style="margin:10px 0 0 44px"><span style="flex:1">予定（点線は時刻なし）</span><span style="flex:1">実績</span></div>`+tline(TD)+(isT?hid(d):'')+(isT&&TSEL&&F(TSEL)?'<div class=sm>選択中の予定</div>'+card(F(TSEL)):'')}

function vSleep(){const k=today(),v=D.sleep[k];return `<div class=card><div class=r style="align-items:center"><div><div class=sm>就寝の記録（日報を書き終えたら押す）</div>${v?`<b style="font-size:20px">${v} に就寝</b>`:'<span class=sm>まだ記録していません</span>'}</div>${v?`<button class=x style="width:auto;padding:0 12px;border-radius:12px" onclick="delete D.sleep['${k}'];save();R()">取消</button>`:`<button class=p onclick="D.sleep['${k}']=hm();save();R();T('おやすみなさい')">おやすみ</button>`}</div></div>`}
function backup(){cp(JSON.stringify({...D,key:''}));D.lastBackup=Date.now();save();R()}
function bkBanner(){const dy=(Date.now()-(D.lastBackup||new Date(D.created+'T00:00:00').getTime()))/864e5;
 if(dy<(D.lastBackup?30:7))return'';return `<div class="card r" style="align-items:center"><span class=sm>${D.lastBackup?'バックアップが30日以上前です':'まだバックアップがありません'}</span><button class=p onclick="backup()">コピー</button></div>`}
function bal0(ym,n=12){if(D.base[ym]!=null)return D.base[ym];if(!n)return 0;const[y,m]=ym.split('-').map(Number),py=m==1?(y-1)+'-12':y+'-'+pad(m-1);return endBal(py,n-1)}
function endBal(ym,n){let e=(D.prev||{})[ym]||0,i=0;for(const k in D.days)if(k.slice(0,7)==ym)for(const x of D.days[k].money||[])x.t=='in'?i+=x.a:e+=x.a;return bal0(ym,n)-e+i}

 try{const r=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+D.key},body:JSON.stringify({model:D.model,response_format:{type:'json_object'},messages:[{role:'system',content:sys},{role:'user',content:JSON.stringify({明日:WN[wd(tom())]+'曜日',明日の予定:t.plan.map(i=>i.n),過去4週間の所要時間と開始時刻:durStats(),最近の起床時刻:w,最近の就寝時刻:Object.entries(D.sleep||{}).slice(-7).map(([k,v])=>k+' '+v)})}]})});
  const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||r.status);ES=JSON.parse(j.choices[0].message.content)}
 catch(e){T('提案に失敗: '+e.message)}
 R()}
function sortPlan(p){let pv=0;return p.map((i,q)=>{const x=pt(i.n),k=x?x[0]:pv+0.01;pv=k;return{i,k,q}}).sort((a,b)=>a.k-b.k||a.q-b.q).map(a=>a.i)}
function applySched(){const t=day(tom()),z=v=>String(v||'').replace(/^0/,'');
 (ES.schedule||[]).forEach(x=>{if(!x||!x.n||!x.s||!x.e)return;const nm=`${z(x.s)}〜${z(x.e)}まで${x.n}`;
  if(x.add){if(!t.plan.some(p=>p.n.includes(x.n)))insT(t.plan,{id:uid(),n:nm})}
  else{const it=t.plan.find(p=>p.n==x.n&&!pt(p.n))||t.plan.find(p=>!pt(p.n)&&p.n.includes(x.n));if(it)it.n=`${z(x.s)}〜${z(x.e)}まで${it.n}`}});
 t.plan=sortPlan(t.plan);ES=null;save();R();T('予定に反映しました')}
R();
